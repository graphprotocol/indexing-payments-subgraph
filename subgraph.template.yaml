specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SubgraphService
    network: {{network}}
    source:
      address: "{{subgraphServiceAddress}}"
      abi: SubgraphService
      startBlock: {{startBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - IndexingAgreement
        - IndexingFeeCollection
        - IndexerDeploymentLatest
      abis:
        - name: SubgraphService
          file: ./abis/SubgraphService.json
      eventHandlers:
        - event: IndexingAgreementAccepted(indexed address,indexed address,indexed bytes16,address,bytes32,uint8,bytes)
          handler: handleIndexingAgreementAccepted
        - event: IndexingAgreementCanceled(indexed address,indexed address,indexed bytes16,address)
          handler: handleIndexingAgreementCanceled
        - event: IndexingAgreementUpdated(indexed address,indexed address,indexed bytes16,address,uint8,bytes)
          handler: handleIndexingAgreementUpdated
        - event: IndexingFeesCollectedV1(indexed address,indexed address,indexed bytes16,address,bytes32,uint256,uint256,uint256,bytes32,uint256,bytes)
          handler: handleIndexingFeesCollectedV1
      file: ./src/subgraphService.ts
  # Indexer registrations get their own data source so they can start from an
  # earlier block than the agreements: an indexer typically registers its URL
  # well before any agreement is accepted, and we want the URL indexed regardless.
  - kind: ethereum
    name: SubgraphServiceRegistration
    network: {{network}}
    source:
      address: "{{subgraphServiceAddress}}"
      abi: SubgraphService
      startBlock: {{registrationStartBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Indexer
      abis:
        - name: SubgraphService
          file: ./abis/SubgraphService.json
      eventHandlers:
        - event: ServiceProviderRegistered(indexed address,bytes)
          handler: handleServiceProviderRegistered
      file: ./src/subgraphService.ts
  - kind: ethereum
    name: RecurringCollector
    network: {{network}}
    source:
      address: "{{recurringCollectorAddress}}"
      abi: RecurringCollector
      startBlock: {{startBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - IndexingAgreement
        - Offer
      abis:
        - name: RecurringCollector
          file: ./abis/RecurringCollector.json
      eventHandlers:
        - event: AgreementAccepted(indexed address,indexed address,indexed address,bytes16,uint64,uint256,uint256,uint32,uint32)
          handler: handleAgreementAccepted
          topic1: ["{{subgraphServiceAddress}}"]
        - event: AgreementCanceled(indexed address,indexed address,indexed address,bytes16,uint8)
          handler: handleAgreementCanceled
          topic1: ["{{subgraphServiceAddress}}"]
        - event: AgreementUpdated(indexed address,indexed address,indexed address,bytes16,uint64,uint256,uint256,uint32,uint32)
          handler: handleAgreementUpdated
          topic1: ["{{subgraphServiceAddress}}"]
        - event: RCACollected(indexed address,indexed address,indexed address,bytes16,bytes32,uint256,uint256)
          handler: handleRCACollected
          topic1: ["{{subgraphServiceAddress}}"]
        - event: OfferStored(indexed bytes16,indexed address,indexed uint8,bytes32)
          handler: handleOfferStored
        - event: OfferCancelled(indexed address,indexed bytes16,indexed bytes32)
          handler: handleOfferCancelled
      file: ./src/recurringCollector.ts
  # Indexer (graph account) metadata: the EthereumDIDRegistry emits a
  # DIDAttributeChanged event with an IPFS hash for the account's metadata
  # document (avatar, display name, etc.), which we index alongside the URL.
  - kind: ethereum
    name: EthereumDIDRegistry
    network: {{network}}
    source:
      address: "{{ethereumDIDRegistryAddress}}"
      abi: EthereumDIDRegistry
      startBlock: {{didRegistryStartBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Account
        - AccountMetadata
      abis:
        - name: EthereumDIDRegistry
          file: ./abis/EthereumDIDRegistry.json
      eventHandlers:
        - event: DIDAttributeChanged(indexed address,bytes32,bytes,uint256,uint256)
          handler: handleDIDAttributeChanged
      file: ./src/ethereumDIDRegistry.ts
templates:
  # File data source: fetches an account's metadata document from IPFS, spawned
  # by handleDIDAttributeChanged. Runs sandboxed (writes only AccountMetadata),
  # so a slow or missing fetch never affects on-chain agreement/URL indexing.
  - kind: file/ipfs
    name: AccountMetadataFile
    mapping:
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/ipfs.ts
      handler: handleAccountMetadata
      entities:
        - AccountMetadata
      abis:
        - name: EthereumDIDRegistry
          file: ./abis/EthereumDIDRegistry.json
