"Agreement lifecycle state"
enum AgreementState {
  "Proposed but not yet accepted (reserved for future use — entities are currently only created on accept)"
  NotAccepted
  Accepted
  CanceledByServiceProvider
  CanceledByPayer
}

type IndexingAgreement @entity(immutable: false) {
  "The agreement ID (bytes16)"
  id: Bytes!
  "The payer address"
  payer: Bytes!
  "The indexer address"
  indexer: Bytes!
  "Link to the indexer's registration record (URL etc.). Null until the indexer's ServiceProviderRegistered event has been indexed; resolves automatically once it is. Lets consumers read the indexer URL alongside the agreement in one query instead of cross-querying the network subgraph."
  indexerInfo: Indexer
  "The allocation linked to this agreement"
  allocationId: Bytes!
  "The subgraph deployment ID"
  subgraphDeploymentId: Bytes!
  "Agreement lifecycle state"
  state: AgreementState!
  "Timestamp when the agreement was accepted"
  acceptedAt: BigInt!
  "Transaction hash of the SubgraphService.acceptIndexingAgreement call. Auditable link from the indexed agreement back to the on-chain accept (typically a multicall(startService+acceptIndexingAgreement)). 32-byte zero sentinel if never accepted (entity created from a stray Updated/Canceled event)."
  acceptedAtTx: Bytes!
  "Timestamp of last collection"
  lastCollectionAt: BigInt!
  "Timestamp when the agreement ends"
  endsAt: BigInt!
  "Maximum tokens for first collection"
  maxInitialTokens: BigInt!
  "Maximum tokens per second for ongoing collections"
  maxOngoingTokensPerSecond: BigInt!
  "Tokens per second from agreement terms"
  tokensPerSecond: BigInt!
  "Tokens per entity per second from agreement terms"
  tokensPerEntityPerSecond: BigInt!
  "Minimum seconds between collections"
  minSecondsPerCollection: Int!
  "Maximum seconds between collections"
  maxSecondsPerCollection: Int!
  "Timestamp when agreement was last updated (0 if never updated)"
  lastUpdatedAt: BigInt!
  "Timestamp when agreement was canceled (0 if not canceled)"
  canceledAt: BigInt!
  "Transaction hash of the SubgraphService.cancelIndexingAgreement* call (32-byte zero if not canceled). Mirrors canceledAt/canceledBy for full auditability of the cancel event."
  canceledAtTx: Bytes!
  "Address that initiated the cancel (zero address if not canceled). Taken from SubgraphService.IndexingAgreementCanceled.canceledOnBehalfOf so operator-initiated cancels are captured correctly."
  canceledBy: Bytes!
  "Total tokens collected over lifetime"
  tokensCollected: BigInt!
  "Block number of the latest state change on this agreement (Accepted / Updated / Canceled / RCACollected). Consumers that reconcile state diffs poll with `lastStateChangeBlock_gt` since last seen block."
  lastStateChangeBlock: BigInt!
  "Fee collection history"
  collections: [IndexingFeeCollection!]! @derivedFrom(field: "agreement")
}

type IndexingFeeCollection @entity(immutable: true) {
  id: Bytes!
  agreement: IndexingAgreement!
  currentEpoch: BigInt!
  tokensCollected: BigInt!
  entities: BigInt!
  poi: Bytes!
  poiBlockNumber: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  "Transaction hash of the SubgraphService.collect call that emitted this fee collection. Auditable per-payment link."
  transactionHash: Bytes!
}

type IndexerDeploymentLatest @entity(immutable: false) {
  id: ID!
  indexer: Bytes!
  subgraphDeploymentId: Bytes!
  agreementId: Bytes!
  entities: BigInt!
  tokensCollected: BigInt!
  poiBlockNumber: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
}

# Indexer registration record from the SubgraphService's ServiceProviderRegistered event.
# Stores the service URL so consumers holding an agreement's indexer address can read it
# here instead of cross-querying the network subgraph. Re-registration is last-write-wins.
type Indexer @entity(immutable: false) {
  "The indexer (service provider) address"
  id: Bytes!
  "Service URL from the latest ServiceProviderRegistered event"
  url: String!
  "Block number of the registration that last set this URL. Consumers polling for URL changes filter with `lastUpdatedAtBlock_gt` since their last seen block."
  lastUpdatedAtBlock: BigInt!
  "Transaction hash of the registration that last set this URL. Auditable link back to the on-chain register call."
  lastUpdatedAtTx: Bytes!
}

# Latest stored offer per agreement id. Dipper reads this as an idempotency gate so a
# restart after a mid-flight crash doesn't re-submit an offer whose tx already landed.
# Updates overwrite in place; OfferCancelled stamps canceledAt (> 0 = safe to re-submit).
type Offer @entity(immutable: false) {
  id: Bytes!
  payer: Bytes!
  "Latest offer type observed (1 = OFFER_TYPE_NEW, 2 = OFFER_TYPE_UPDATE)."
  offerType: Int!
  "Latest stored offer hash; tracks the on-chain rcaOffers / rcauOffers entry."
  offerHash: Bytes!
  "Timestamp when the offer was canceled on-chain (0 if currently live)."
  canceledAt: BigInt!
  "Block/timestamp/tx of the first OFFER_TYPE_NEW for this agreement id."
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  createdAtTx: Bytes!
}

# Current role membership on the RecurringAgreementManager, one entity per (role, account).
# The indexer trusts agreement proposal signers that hold an active AGREEMENT_MANAGER_ROLE.
# PAUSE_ROLE is skipped: it cannot grant, and its emergency revokes still emit RoleRevoked.
type RoleAssignment @entity(immutable: false) {
  "The role id (bytes32) concatenated with the account address (bytes20)."
  id: Bytes!
  "The role identifier (keccak256 of the role name)."
  role: Bytes!
  "The account the role was granted to or revoked from."
  account: Bytes!
  "True while the account currently holds the role."
  active: Boolean!
  "Block/timestamp/tx of the most recent grant (0 / 32-byte zero if never granted)."
  grantedAtBlock: BigInt!
  grantedAtTimestamp: BigInt!
  grantedAtTx: Bytes!
  "The account that performed the most recent grant (zero address if never granted)."
  grantedBy: Bytes!
  "Block/timestamp/tx of the most recent revoke (0 / 32-byte zero if never revoked)."
  revokedAtBlock: BigInt!
  revokedAtTimestamp: BigInt!
  revokedAtTx: Bytes!
  "The account that performed the most recent revoke (zero address if never revoked)."
  revokedBy: Bytes!
}

# Admin-role hierarchy for the indexed roles, one entity per role. Records which
# role currently administers each indexed role (i.e. who may grant/revoke it),
# updated on every RoleAdminChanged for one of those roles.
type RoleAdmin @entity(immutable: false) {
  "The role whose admin changed (bytes32); same value as `role`."
  id: Bytes!
  "The role identifier."
  role: Bytes!
  "The role that currently administers this role."
  adminRole: Bytes!
  "The admin role in effect before the most recent change."
  previousAdminRole: Bytes!
  "Block/timestamp/tx of the most recent admin change."
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  updatedAtTx: Bytes!
}
